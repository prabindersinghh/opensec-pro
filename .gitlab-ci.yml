image: node:20-bookworm

stages:
  - validate
  - test
  - security
  - verify
  - package
  - deploy
  - health

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

variables:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  OPENSEC_PROOF_NETWORK: "disabled"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

.node_job:
  before_script:
    - node --version
    - npm ci --cache .npm --prefer-offline

validate:lock-and-flow:
  extends: .node_job
  stage: validate
  script:
    - npm run build
    - node scripts/gitlab/validate-flow.mjs

test:unit-and-e2e:
  extends: .node_job
  stage: test
  script:
    - npm run lint
    - npm run build
    - npm test -- --reporter=dot
  artifacts:
    when: always
    expire_in: 1 week

security:deterministic-scan:
  extends: .node_job
  stage: security
  script:
    - npm run build
    - mkdir -p artifacts
    # Scan product code only. The intentionally vulnerable demo is tested separately.
    - node dist/bin/cmdr.js scan src/security --quick --ci > artifacts/opensec-findings.json
    - node scripts/gitlab/render-report.mjs artifacts/opensec-findings.json artifacts/opensec-report.html
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - artifacts/opensec-findings.json
      - artifacts/opensec-report.html

verify:isolated-proof:
  extends: .node_job
  stage: verify
  script:
    - npm run build
    - mkdir -p artifacts
    - node scripts/gitlab/proof-verification.mjs artifacts/proof-result.json artifacts/remediation-result.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - artifacts/proof-result.json
      - artifacts/remediation-result.json

package:demo:
  extends: .node_job
  stage: package
  script:
    - npm run build
    - npm pack --pack-destination artifacts
  artifacts:
    expire_in: 1 week
    paths:
      - artifacts/*.tgz

# Deployment is deliberately manual and allowlisted. Set DEMO_DEPLOY_TARGET to the
# approved staging target and provide the credentials as masked CI/CD variables.
deploy:restricted-demo:
  stage: deploy
  needs: [package:demo]
  rules:
    - if: '$DEMO_DEPLOY_TARGET'
      when: manual
    - when: never
  script:
    - test "$DEMO_DEPLOY_TARGET" = "approved-staging"
    - test -n "$DEMO_DEPLOY_COMMAND"
    - sh -c "$DEMO_DEPLOY_COMMAND"

health:post-deployment:
  image: curlimages/curl:8.10.1
  stage: health
  needs: [deploy:restricted-demo]
  rules:
    - if: '$DEMO_LAB_URL'
    - when: never
  script:
    - curl --fail --silent --show-error --max-time 15 "$DEMO_LAB_URL/health"
